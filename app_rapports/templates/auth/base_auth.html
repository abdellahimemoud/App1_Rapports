<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("bi-eye-fill", "bi-eye-slash-fill");
    } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash-fill", "bi-eye-fill");
    }
}
</script>

</head>



<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
</div>
<!-- ================= Messages Django - Top Center SaaS ================= -->
{% if messages %}
<div class="position-fixed top-0 start-50 translate-middle-x p-3"
     style="z-index: 1080; min-width: 320px; max-width: 420px;">

  {% for message in messages %}

    {% if message.tags == "success" %}
      <div class="alert alert-success shadow border-0 text-center auto-dismiss">
        <i class="bi bi-check-circle-fill me-2"></i>{{ message }}
      </div>

    {% elif message.tags == "error" %}
      <div class="alert alert-danger shadow border-0 text-center auto-dismiss">
        <i class="bi bi-x-circle-fill me-2"></i>{{ message }}
      </div>

    {% elif message.tags == "warning" %}
      <div class="alert alert-warning shadow border-0 text-center auto-dismiss">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
      </div>

    {% else %}
      <div class="alert alert-info shadow border-0 text-center auto-dismiss">
        <i class="bi bi-info-circle-fill me-2"></i>{{ message }}
      </div>
    {% endif %}

  {% endfor %}
</div>
{% endif %}

<!-- ================= Disparition automatique ================= -->
<script>
  setTimeout(() => {
    document.querySelectorAll(".auto-dismiss").forEach(el => {
      el.classList.add("fade");
      setTimeout(() => el.remove(), 400);
    });
  }, 3000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
